schema: hydra-rsi/1
# Committed size at HEAD of the files the static site serves (page weight, mostly images).
metrics:
  - id: site.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
