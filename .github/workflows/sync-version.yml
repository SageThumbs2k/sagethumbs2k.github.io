name: Sync site version to latest release

# The version baked into index.html is what everything that does not run
# JavaScript reads -- search crawlers, AI answer engines, link unfurlers, and any
# visitor whose request hit GitHub's anonymous API limit and fell back. Left to a
# human it went six releases stale (1.8.2 in the file while 2.3.0 was shipping),
# so it is generated instead.
#
# Three triggers on purpose:
#   schedule          - the safety net. Nothing has to be wired up for this to work.
#   workflow_dispatch - a button, for when a release just went out and waiting is silly.
#   repository_dispatch - so the product repo's release job can poke this the
#                         moment it publishes. Needs a PAT over there; until one
#                         exists the schedule still covers it, which is why the
#                         schedule is not merely a backup.

on:
  schedule:
    # 06:20 UTC daily. Off the hour because every scheduler on GitHub fires on
    # it and the queue there is measured in tens of minutes.
    - cron: '20 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

concurrency:
  group: sync-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Rewrite the version from the latest release
        env:
          # Lifts the 60-per-hour anonymous API limit. Read-only; the write below
          # uses the checkout's own credentials.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-version.mjs

      - name: Commit if it changed
        # Every file the script owns: index.html (version, download links, format count), the
        # three text files that state the count, pricing.md and the web manifest (both were
        # rewritten by the script but never committed here until 2026-09-19, audit F24). Keep this list equal to the
        # script's COUNT_RULES keys, or a rewritten file is left uncommitted and the job
        # reports success while the site stays stale.
        run: |
          if git diff --quiet -- index.html llms.txt llms-full.txt docs/ABOUT.md pricing.md site.webmanifest; then
            echo "already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html llms.txt llms-full.txt docs/ABOUT.md pricing.md site.webmanifest
          git commit -m "Sync the site version and format count to the latest release

          Generated by .github/workflows/sync-version.yml. The version and the
          format count in these files are what crawlers and AI answer engines
          read, and each drifted by hand once already (six releases behind, then
          twelve formats ahead), so neither is maintained by hand any more."
          git push
