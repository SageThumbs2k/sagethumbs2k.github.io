name: copy budget

# The landing page is the thing a stranger reads. This keeps two owner rules from drifting:
# no em-dashes in visitor-facing copy, and the page does not quietly grow back after it was
# cut. The word count is a ratchet against a recorded baseline, not a fixed bar, so it is
# green today and can only get better.

#
# The format guides (/formats/) are generated from scripts/format-pages.data.mjs; their check
# applies the same copy rules to every guide, fails when a generated file is stale, and fails
# when the homepage wall's chips stop linking their guides (the app repo's gen-site.mjs writes
# those links from formats/guides.json).

# ci-trigger-ok: PUBLIC repo, hosted minutes are free; a ~20 s copy check on the files it reads.
on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'scripts/copy-budget.*'
      - 'scripts/format-pages*'
      - 'formats/**'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'pricing.md'
      - 'docs/ABOUT.md'
      - 'site.webmanifest'
      - 'scripts/sync-version.mjs'
      - '.github/workflows/copy-budget.yml'
  pull_request:
    paths:
      - '**/index.html'
      - 'scripts/copy-budget.*'
      - 'scripts/format-pages*'
      - 'formats/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node scripts/copy-budget.mjs
      - run: node scripts/format-pages.mjs --check
      # Every sentence the version sync rewrites must still be there. 2026-11-06: a pricing edit
      # dropped pricing.md's "All N supported formats", and the sync failed only after the release.
      # Also red while the version or count is stale after a release; dispatch sync-version.yml.
      - run: node scripts/sync-version.mjs --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
